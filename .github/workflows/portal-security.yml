name: Portal security checks

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: portal-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Verify source and security invariants
        run: npm run check

      - name: Build deployment allowlist
        run: npm run build

      - name: Prove internal files are excluded
        shell: bash
        run: |
          test ! -e dist/AGENTS.md
          test ! -e dist/supabase
          test ! -e dist/docs
          test ! -e dist/tools
          test ! -e dist/gas-order-script.js
